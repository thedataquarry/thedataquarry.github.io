<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-labelledby="title desc">
  <title id="title">CocoIndex functions are tracked, memoizable Python functions</title>
  <desc id="desc">A sequence-style diagram showing ABO listing JSON and image bytes flowing through named CocoIndex functions into a ProductRow declared in LanceDB.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#5b6570"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 18px; font-weight: 850; fill: #18212a; }
      .lane { font-size: 12px; font-weight: 800; fill: #64707d; text-transform: uppercase; }
      .box-title { font-size: 13px; font-weight: 820; fill: #18212a; }
      .box-note { font-size: 11px; fill: #64707d; }
      .chip { font-size: 10px; font-weight: 780; fill: #0b6f6a; }
      .arrow-label { font-size: 10.5px; fill: #64707d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="340" rx="14" fill="#ffffff"/>

  <g class="label">
    <text x="34" y="42" class="title">Functions are tracked, memoizable Python functions</text>

    <rect x="24" y="66" width="1132" height="250" rx="12" fill="#f7faf9" stroke="#d6e2df"/>
    <line x1="40" y1="146" x2="1140" y2="146" stroke="#d6e2df" stroke-width="1"/>
    <line x1="40" y1="232" x2="1140" y2="232" stroke="#d6e2df" stroke-width="1"/>

    <text x="42" y="104" class="lane">listing lane</text>
    <text x="42" y="190" class="lane">image lane</text>
    <text x="42" y="276" class="lane">target lane</text>

    <rect x="142" y="85" width="116" height="54" rx="8" fill="#fffaf0" stroke="#d8b46f"/>
    <text x="200" y="107" text-anchor="middle" class="box-title">ABO JSON</text>
    <text x="200" y="125" text-anchor="middle" class="box-note">source file</text>

    <rect x="296" y="85" width="132" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="362" y="106" text-anchor="middle" class="box-title">load_listing</text>
    <text x="362" y="124" text-anchor="middle" class="chip">memo=True</text>

    <rect x="466" y="85" width="150" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="541" y="106" text-anchor="middle" class="box-title">normalize_product</text>
    <text x="541" y="124" text-anchor="middle" class="chip">memo=True</text>

    <rect x="654" y="85" width="142" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="725" y="106" text-anchor="middle" class="box-title">build_text</text>
    <text x="725" y="124" text-anchor="middle" class="chip">memo=True</text>

    <rect x="834" y="85" width="126" height="54" rx="8" fill="#eef7f6" stroke="#0b6f6a"/>
    <text x="897" y="106" text-anchor="middle" class="box-title">embed_text</text>
    <text x="897" y="124" text-anchor="middle" class="box-note">MiniLM vector</text>

    <line x1="258" y1="112" x2="294" y2="112" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="428" y1="112" x2="464" y2="112" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="616" y1="112" x2="652" y2="112" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="796" y1="112" x2="832" y2="112" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="142" y="171" width="116" height="54" rx="8" fill="#fffaf0" stroke="#d8b46f"/>
    <text x="200" y="193" text-anchor="middle" class="box-title">image file</text>
    <text x="200" y="211" text-anchor="middle" class="box-note">source bytes</text>

    <rect x="466" y="171" width="150" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="541" y="192" text-anchor="middle" class="box-title">read_image_bytes</text>
    <text x="541" y="210" text-anchor="middle" class="chip">memo=True</text>

    <rect x="654" y="171" width="142" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="725" y="192" text-anchor="middle" class="box-title">embed_image</text>
    <text x="725" y="210" text-anchor="middle" class="box-note">CLIP vector</text>

    <line x1="258" y1="198" x2="464" y2="198" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="616" y1="198" x2="652" y2="198" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="834" y="257" width="126" height="54" rx="8" fill="#ffffff" stroke="#98c9c4"/>
    <text x="897" y="278" text-anchor="middle" class="box-title">build_row</text>
    <text x="897" y="296" text-anchor="middle" class="chip">memo=True</text>

    <rect x="998" y="257" width="118" height="54" rx="8" fill="#fff6f5" stroke="#d39a95"/>
    <text x="1057" y="278" text-anchor="middle" class="box-title">ProductRow</text>
    <text x="1057" y="296" text-anchor="middle" class="box-note">declare row</text>

    <path d="M897 139 V245" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M725 225 V246 Q725 284 832 284" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="960" y1="284" x2="996" y2="284" stroke="#5b6570" stroke-width="1.6" marker-end="url(#arrow)"/>

    <text x="910" y="186" class="arrow-label">text vector</text>
    <text x="748" y="266" class="arrow-label">image vector</text>
  </g>
</svg>
