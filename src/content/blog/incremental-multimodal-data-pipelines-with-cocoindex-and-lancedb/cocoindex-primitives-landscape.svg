<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" role="img" aria-labelledby="title desc">
  <title id="title">CocoIndex app, processing components, and functions</title>
  <desc id="desc">Source data sits outside the CocoIndex app. The app contains processing components, and each component contains functions. The app declares target state in LanceDB.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#5c6670"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="310" rx="12" fill="#ffffff"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="28" y="88" width="116" height="64" rx="8" fill="#fffaf0" stroke="#d8b46f" stroke-width="2"/>
    <text x="86" y="124" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">Source</text>

    <line x1="154" y1="120" x2="220" y2="120" stroke="#5c6670" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="187" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#5c6670">observed by</text>

    <rect x="232" y="38" width="356" height="164" rx="12" fill="#f8fbfc" stroke="#2f6f8f" stroke-width="2.2" stroke-dasharray="7 5"/>
    <image x="254" y="58" width="34" height="37" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="298" y="82" font-size="16" font-weight="900" fill="#2f6f8f">CocoIndex app</text>

    <rect x="260" y="104" width="300" height="72" rx="9" fill="#f5fbf7" stroke="#3f7f5f" stroke-width="2"/>
    <text x="410" y="128" text-anchor="middle" font-size="14" font-weight="850" fill="#3f7f5f">Processing component</text>

    <rect x="286" y="142" width="76" height="24" rx="6" fill="#ffffff" stroke="#b8c5cf"/>
    <rect x="372" y="142" width="76" height="24" rx="6" fill="#ffffff" stroke="#b8c5cf"/>
    <rect x="458" y="142" width="76" height="24" rx="6" fill="#ffffff" stroke="#b8c5cf"/>
    <text x="324" y="158" text-anchor="middle" font-size="12" font-weight="750" fill="#1f2933">function 1</text>
    <text x="410" y="158" text-anchor="middle" font-size="12" font-weight="750" fill="#1f2933">function 2</text>
    <text x="496" y="158" text-anchor="middle" font-size="12" font-weight="750" fill="#1f2933">function 3</text>

    <line x1="598" y1="120" x2="666" y2="120" stroke="#5c6670" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="632" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#5c6670">
      <tspan x="632" dy="0">declares</tspan>
      <tspan x="632" dy="14">state in</tspan>
    </text>

    <rect x="676" y="88" width="116" height="64" rx="8" fill="#fff6f5" stroke="#d39a95" stroke-width="2"/>
    <text x="734" y="124" text-anchor="middle" font-size="15" font-weight="800" fill="#1f2933">Target</text>

    <rect x="84" y="232" width="190" height="48" rx="8" fill="#ffffff" stroke="#aeb8c2" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="315" y="232" width="190" height="48" rx="8" fill="#ffffff" stroke="#aeb8c2" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="546" y="232" width="190" height="48" rx="8" fill="#ffffff" stroke="#aeb8c2" stroke-width="1.5" stroke-dasharray="5 4"/>

    <text x="104" y="252" font-size="12" font-weight="850" fill="#1f2933">Coarse</text>
    <text x="104" y="268" font-size="11" fill="#5c6670">large scope, like a directory</text>

    <text x="335" y="252" font-size="12" font-weight="850" fill="#1f2933">Medium</text>
    <text x="335" y="268" font-size="11" fill="#5c6670">one product or file</text>

    <text x="566" y="252" font-size="12" font-weight="850" fill="#1f2933">Fine</text>
    <text x="566" y="268" font-size="11" fill="#5c6670">smaller unit, like a chunk</text>
  </g>
</svg>
