<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="csr-layout-title csr-layout-desc">
<title id="csr-layout-title">CSR adjacency storage</title>
<desc id="csr-layout-desc">Maya knows Nina and Omar, Nina knows Pedro, and Omar knows Pedro. These edges become offsets [0, 2, 3, 4, 4] and neighbours [Nina, Omar, Pedro, Pedro]. Maya's slice is neighbours[0..2] = [Nina, Omar]; Pedro has an empty slice.</desc>
