<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="query-plan-title query-plan-desc">
<title id="query-plan-title">SQL query as a plan of operators</title>
<desc id="query-plan-desc">Data flows upward from Scan through Filter and Aggregate to Sort.</desc>
<defs><marker id="query-plan-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.8 L9.2 5 L0 9.2 z" fill="#5b6475"/></marker></defs>
<rect width="720" height="330" rx="16" fill="#faf9f6"/>
<g font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#2d3142">
<rect x="96" y="40" width="528" height="52" rx="10" fill="#e9eff7" stroke="#93abcd" stroke-width="1.25"/>
<text x="120" y="73" font-size="19" font-weight="600" text-anchor="start" fill="#2d3142">Sort</text>
<text x="288" y="73" font-size="17" font-weight="400" text-anchor="start" fill="#5b6475" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">n DESC</text>
<rect x="96" y="114" width="528" height="52" rx="10" fill="#e9eff7" stroke="#93abcd" stroke-width="1.25"/>
<text x="120" y="147" font-size="19" font-weight="600" text-anchor="start" fill="#2d3142">Aggregate</text>
<text x="288" y="147" font-size="17" font-weight="400" text-anchor="start" fill="#5b6475" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">group by city, count(*)</text>
<path d="M360 112 V96" fill="none" stroke="#5b6475" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#query-plan-arrow)"/>
<rect x="96" y="188" width="528" height="52" rx="10" fill="#e9eff7" stroke="#93abcd" stroke-width="1.25"/>
<text x="120" y="221" font-size="19" font-weight="600" text-anchor="start" fill="#2d3142">Filter</text>
<text x="288" y="221" font-size="17" font-weight="400" text-anchor="start" fill="#5b6475" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">age &gt; 30</text>
<path d="M360 186 V170" fill="none" stroke="#5b6475" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#query-plan-arrow)"/>
<rect x="96" y="262" width="528" height="52" rx="10" fill="#e9eff7" stroke="#93abcd" stroke-width="1.25"/>
<text x="120" y="295" font-size="19" font-weight="600" text-anchor="start" fill="#2d3142">Scan</text>
<text x="288" y="295" font-size="17" font-weight="400" text-anchor="start" fill="#5b6475" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">person (city, age)</text>
<path d="M360 260 V244" fill="none" stroke="#5b6475" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#query-plan-arrow)"/>
<path d="M60 306 V48" fill="none" stroke="#5b6475" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#query-plan-arrow)"/>
<text x="44" y="177.0" font-size="12" font-weight="600" fill="#8a91a0" letter-spacing="1.4" text-anchor="middle" transform="rotate(-90 44 177.0)">RECORD BATCHES</text>
</g>
</svg>
