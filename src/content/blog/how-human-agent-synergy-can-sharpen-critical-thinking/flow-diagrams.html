<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human-agent learning flows</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style id="synergy-flow-styles">
      .synergy-flow {
        margin: 1.5rem 0;
        container-type: inline-size;
      }
      .synergy-flow svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .synergy-flow svg > rect[rx] {
        filter: drop-shadow(0 2px 3px rgba(45, 49, 66, 0.12));
      }
      .synergy-flow .synergy-flow-compact {
        display: none;
      }
      @container (max-width: 520px) {
        .synergy-flow .synergy-flow-wide {
          display: none;
        }
        .synergy-flow .synergy-flow-compact {
          display: block;
          width: min(100%, 360px);
          margin-inline: auto;
        }
      }
    </style>
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f5f5f5;
        color: #2d3142;
        font-family: Geist, system-ui, sans-serif;
      }
      main {
        max-width: 784px;
        margin: auto;
      }
      h1 {
        font:
          400 40px 'Instrument Serif',
          Georgia,
          serif;
        margin: 0 0 40px;
      }
      h2 {
        font-size: 20px;
        font-weight: 500;
        margin: 40px 0 12px;
      }
    </style>
  </head>
